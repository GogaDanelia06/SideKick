<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.4 26.7 78 78">
  <style>
    /* #04030c is the ink the logo file uses for its own letterforms, so this is
       the brand black rather than one picked to look close.

       The stroke only appears in a dark browser: a black tile on dark chrome is
       a hole where the icon should be, and at 16px the letters alone are not
       enough to find the tab by. It stays invisible on light, where the tile
       already has all the edge it needs. */
    .tile { fill: #04030c; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .tile { stroke: #3d4148; stroke-width: 3; }
    }
  </style>
  <rect class="tile" x="26.4" y="26.7" width="78" height="78" rx="16"/>
