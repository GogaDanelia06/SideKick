# pnpm 12 reads its settings from this file and ignores the "pnpm" field in package.json.
# Rationale for each entry: docs/DEPENDENCIES.md.

# Install scripts pnpm may run. Prisma generates its client and fetches its engines;
# esbuild and unrs-resolver fetch their native binaries. Anything unlisted fails the install.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# @prisma/config pins deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx, patched in 8.0.0).
# Remove once Prisma depends on deepmerge-ts 8 itself.
overrides:
  deepmerge-ts: ^8.0.2

# These lint plugins still declare ESLint 9 at most; they run on 10 through @eslint/compat.
# Remove each entry once the plugin declares ESLint 10 itself.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
